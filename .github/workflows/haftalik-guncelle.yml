name: Haftalık Oyun Kataloğu ve Fiyat Denetimi

# Her Pazartesi 06:00 UTC (TR ~09:00) + elle tetikleme
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Katalog ve takas akışı testleri
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/frontend.test.cjs

      - name: Veriyi CSV'lerden derle
        run: python3 scripts/build_data.py

      - name: Kapakları ekle — Steam (anahtarsız)
        run: python3 scripts/enrich_images_steam.py || true

      - name: Kapakları tamamla — RAWG (anahtar varsa)
        env:
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
        run: |
          if [ -n "$RAWG_KEY" ]; then
            python3 scripts/enrich_images.py || true
          else
            echo "RAWG_KEY yok, atlanıyor."
          fi

      - name: Canlı fiyat ve eksik oyun denetimi
        run: python3 scripts/check_prices.py

      - name: Başarısız denetim ayrıntıları
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fiyat-denetim-hata
          path: data/fiyat-denetim-hata.json
          if-no-files-found: ignore

      - name: Commit & push
        run: |
          git config user.name "KonsolTech Bot"
          git config user.email "bot@konsoltech.tr"
          git add data/games.json data/yeni-oyunlar.txt data/fiyat-uyari.txt data/fiyat-denetim.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Haftalık katalog ve fiyat denetimi ($(date +%Y-%m-%d))"
            git push
          fi
